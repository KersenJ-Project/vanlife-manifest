apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanlife-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vanlife-frontend
  template:
    metadata:
      labels:
        app: vanlife-frontend
    spec:
      containers:
        - name: vanlife-frontend
          image: nyle890/414-vanlife-frontend:clean-version
          imagePullPolicy: Always
          ports:
            - containerPort: 80